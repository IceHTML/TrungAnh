<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Các bài hát của Ngọt Band</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Các album của Ngọt Band</h1>
            <p>Bấm vào hình ảnh để xem chi tiết</p>
        </header>

        <div class="song-list">

            <!-- Bài 1: Chuông Báo Thức (Chuyển sang bai1.html) -->
            <div class="song-item">
                <div class="album-cover" onmouseenter="playPreview(this)" onmouseleave="stopPreview(this)">
                    <a href="bai1.html">
                        <img src="https://picsum.photos/100/100?random=1" alt="Bìa Chuông Báo Thức">
                    </a>
                    <audio src="https://www.w3schools.com/html/horse.mp3"></audio>
                </div>
                <div class="song-info">
                    <div class="song-title">1. Chuông Báo Thức</div>
                    <div class="song-meta">Album: Ngọt | Năm phát hành: 2016</div>
                </div>
            </div>

            <!-- Bài 2: Cho Tôi Đi Theo (Chuyển sang bai2.html) -->
            <div class="song-item">
                <div class="album-cover" onmouseenter="playPreview(this)" onmouseleave="stopPreview(this)">
                    <a href="bai2.html">
                        <img src="https://picsum.photos/100/100?random=2" alt="Bìa Cho Tôi Đi Theo">
                    </a>
                    <audio src="https://www.w3schools.com/html/horse.mp3"></audio>
                </div>
                <div class="song-info">
                    <div class="song-title">2. Cho Tôi Đi Theo</div>
                    <div class="song-meta">Album: Ngọt | Năm phát hành: 2016</div>
                </div>
            </div>

            <!-- Bài 3: Lần Cuối (Chuyển sang bai3.html) -->
            <div class="song-item">
                <div class="album-cover" onmouseenter="playPreview(this)" onmouseleave="stopPreview(this)">
                    <a href="bai3.html">
                        <img src="https://picsum.photos/100/100?random=3" alt="Bìa Lần Cuối">
                    </a>
                    <audio src="https://www.w3schools.com/html/horse.mp3"></audio>
                </div>
                <div class="song-info">
                    <div class="song-title">3. Lần Cuối (Đi Đâu Về Đâu)</div>
                    <div class="song-meta">Album: 3 | Năm phát hành: 2019</div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
