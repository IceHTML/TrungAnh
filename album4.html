<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suýt 1 & 2 - Ngọt</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-surface: #181818;
            --bg-highlight: #282828;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --spotify-green: #1ed760;
            --album-red: #e60000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* HEADER BANNER STYLES */
        .album-header {
            background: linear-gradient(180deg, var(--album-red) 0%, #800000 70%, #121212 100%);
            padding: 40px 32px 24px 32px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
        }

        .album-cover {
            width: 192px;
            height: 192px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #ff3333;
            font-size: 24px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .album-type {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .album-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.1;
            margin: 4px 0 12px 0;
        }

        .album-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .artist-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            margin-right: 4px;
        }

        .dot-separator {
            margin: 0 4px;
            color: var(--text-secondary);
        }

        .album-subtext {
            color: var(--text-secondary);
        }

        /* ACTION BAR */
        .action-bar {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--spotify-green);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background-color: #1fdf64;
        }

        .btn-play svg {
            width: 22px;
            height: 22px;
            fill: #000;
            margin-left: 2px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-primary);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .list-view-btn {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* SONG LIST TABLE STYLES */
        .song-list-container {
            padding: 0 32px;
        }

        .song-table-header {
            display: grid;
            grid-template-columns: 48px 1fr 100px;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .song-row {
            display: grid;
            grid-template-columns: 48px 1fr 100px;
            padding: 10px 16px;
            border-radius: 4px;
            align-items: center;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .song-row:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .song-index {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
        }

        .song-row:hover .song-index {
            color: var(--text-primary);
        }

        .song-info {
            display: flex;
            flex-direction: column;
        }

        .song-title {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }

        .song-duration {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER ALBUM -->
        <div class="album-header">
            <div class="album-cover">
                <!-- Mày có thể thay link ảnh bìa Suýt ở đây -->
                <img src="https://i.scdn.co/image/ab67616d0000b273d4ee7dc5e2f7584102ff0b7a" alt="Suýt Cover" onerror="this.onerror=null; this.parentElement.innerText='Suýt 1&2';">
            </div>
            <div class="album-info">
                <span class="album-type">EP</span>
                <h1 class="album-title">Suýt 1 & 2</h1>
                <div class="album-meta">
                    <div class="artist-avatar">ngọt</div>
                    <strong>Ngọt</strong>
                    <span class="dot-separator">•</span>
                    <span>2024</span>
                    <span class="dot-separator">•</span>
                    <span class="album-subtext">8 bài hát</span>
                </div>
            </div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar">
            <div class="action-left">
                <button class="btn-play" title="Phát">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="icon-btn" title="Trộn bài">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="icon-btn" title="Thêm vào thư viện">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </button>
            </div>
            <div class="list-view-btn">
                <span>Danh sách</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </div>
        </div>

        <!-- LIST BÀI HÁT BANNER LIST -->
        <div class="song-list-container">
            <div class="song-table-header">
                <div>#</div>
                <div>Tiêu đề</div>
                <div style="text-align: right;">Thời gian</div>
            </div>

            <div id="songList"></div>
        </div>
    </div>

    <script>
        const songs = [
            { id: "01", title: "Chuyện Dở Dang", duration: "--:--" },
            { id: "02", title: "Mơ Làm Ma", duration: "--:--" },
            { id: "03", title: "Hay Là", duration: "--:--" },
            { id: "04", title: "Thắp Hương Hóa Vàng", duration: "--:--" },
            { id: "06", title: "Quen Lắm", duration: "--:--" },
            { id: "07", title: "Chiều Hồ Tây", duration: "--:--" },
            { id: "08", title: "Leo Đèo", duration: "--:--" },
            { id: "09", title: "Chuyện Thường", duration: "--:--" }
        ];

        const songListContainer = document.getElementById('songList');

        songs.forEach((song, index) => {
            const row = document.createElement('div');
            row.className = 'song-row';
            row.innerHTML = `
                <div class="song-index">${song.id}</div>
                <div class="song-info">
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">Ngọt</div>
                </div>
                <div class="song-duration">${song.duration}</div>
            `;
            
            row.addEventListener('click', () => {
                alert(`Đang phát bài: ${song.id} - ${song.title}`);
            });

            songListContainer.appendChild(row);
        });
    </script>
</body>
</html>
