<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suýt 1 - Ngọt</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-surface: #181818;
            --bg-highlight: #282828;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --spotify-green: #1ed760;
            --album-red: #e60000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #121212;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* HEADER BANNER STYLES */
        .album-header {
            background: linear-gradient(180deg, var(--album-red) 0%, #800000 70%, #121212 100%);
            padding: 40px 32px 24px 32px;
            display: flex;
            align-items: flex-end;
            gap: 24px;
        }

        .album-cover {
            width: 192px;
            height: 192px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background-color: #000;
            overflow: hidden;
            flex-shrink: 0;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .album-type {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .album-title {
            font-size: 64px;
            font-weight: 900;
            line-height: 1.1;
            margin: 4px 0 12px 0;
        }

        .album-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .artist-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            margin-right: 4px;
        }

        .dot-separator {
            margin: 0 4px;
            color: var(--text-secondary);
        }

        .album-subtext {
            color: var(--text-secondary);
        }

        /* ACTION BAR */
        .action-bar {
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .btn-play {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--spotify-green);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-play:hover {
            transform: scale(1.05);
            background-color: #1fdf64;
        }

        .btn-play svg {
            width: 22px;
            height: 22px;
            fill: #000;
            margin-left: 2px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-primary);
        }

        .icon-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .list-view-btn {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* SONG LIST TABLE STYLES */
        .song-list-container {
            padding: 0 32px;
        }

        .song-table-header {
            display: grid;
            grid-template-columns: 48px 1fr 100px;
            padding: 8px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .song-row {
            display: grid;
            grid-template-columns: 48px 1fr 100px;
            padding: 10px 16px;
            border-radius: 4px;
            align-items: center;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .song-row:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .song-row.active .song-title {
            color: var(--spotify-green);
        }

        .song-index-container {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .song-index {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
            display: inline-block;
        }

        .row-play-icon {
            display: none;
            width: 16px;
            height: 16px;
            fill: var(--text-primary);
        }

        .song-row:hover .song-index {
            display: none;
        }

        .song-row:hover .row-play-icon {
            display: block;
        }

        .song-info {
            display: flex;
            flex-direction: column;
        }

        .song-title {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
        }

        .song-artist {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 2px;
        }

        .song-duration {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: right;
        }

        /* BOTTOM PLAYER BAR STYLES */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: #000000;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 30%;
        }

        .player-cover {
            width: 56px;
            height: 56px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #282828;
        }

        .player-song-details {
            display: flex;
            flex-direction: column;
        }

        .player-song-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .player-song-artist {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
            gap: 8px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .control-btn:hover {
            color: var(--text-primary);
        }

        .control-btn-play {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--text-primary);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .control-btn-play:hover {
            transform: scale(1.06);
        }

        .control-btn-play svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .time-text {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 32px;
        }

        .progress-bar-wrapper {
            flex-grow: 1;
            height: 4px;
            background-color: #4d4d4d;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--text-primary);
            border-radius: 2px;
        }

        .progress-bar-wrapper:hover .progress-bar-fill {
            background-color: var(--spotify-green);
        }

        .player-right {
            width: 30%;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER ALBUM -->
        <div class="album-header">
            <div class="album-cover">
                <img id="mainAlbumCover" src="Suyt.png" alt="Suýt 1">
            </div>
            <div class="album-info">
                <span class="album-type">EP</span>
                <h1 class="album-title">Suýt 1</h1>
                <div class="album-meta">
                    <strong>Ngọt</strong>
                    <span class="dot-separator">•</span>
                    <span>2024</span>
                    <span class="dot-separator">•</span>
                    <span class="album-subtext">4 bài hát</span>
                </div>
            </div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar">
            <div class="action-left">
                <button class="btn-play" id="btnHeaderPlay" title="Phát tất cả">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="icon-btn" title="Trộn bài">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="icon-btn" title="Thêm vào thư viện">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </button>
            </div>
            <div class="list-view-btn">
                <span>Danh sách</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </div>
        </div>

        <!-- LIST BÀI HÁT -->
        <div class="song-list-container">
            <div class="song-table-header">
                <div>#</div>
                <div>Tiêu đề</div>
                <div style="text-align: right;">Thời gian</div>
            </div>

            <div id="songList"></div>
        </div>
    </div>

    <!-- PLAYER BAR BÊN DƯỚI -->
    <div class="player-bar">
        <div class="player-left">
            <img class="player-cover" id="playerCover" src="https://i.scdn.co/image/ab67616d0000b273d4ee7dc5e2f7584102ff0b7a" alt="Cover">
            <div class="player-song-details">
                <span class="player-song-title" id="playerTitle">Chưa chọn bài</span>
                <span class="player-song-artist">Ngọt</span>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="btnPrev" title="Bài trước">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="control-btn-play" id="btnTogglePlay" title="Phát/Tạm dừng">
                    <svg id="playIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="control-btn" id="btnNext" title="Bài tiếp">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="progress-container">
                <span class="time-text" id="currentTime">0:00</span>
                <div class="progress-bar-wrapper" id="progressWrapper">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
                <span class="time-text" id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="player-right"></div>
    </div>

    <!-- AUDIO ELEMENT ĐỂ PHÁT NHẠC -->
    <audio id="audioPlayer"></audio>

    <script>
        // Danh sách 4 bài hát của EP Suýt 1
        const songs = [
            { id: "01", title: "01 Chuyện Dở Dang", src: "Ngọt - 01 Chuyen Do Dang.mp3" },
            { id: "02", title: "02 Mơ Làm Ma", src: "Ngọt - 02 Mo Lam Ma (ft. Thỏ Trauma).mp3" },
            { id: "03", title: "03Hay Là", src: "Ngọt - 03 Hay La.mp3" },
            { id: "04", title: "04 Thắp Hương & 05 Hóa Vàng", src: "Ngọt - 04 Thap Huong 05 Hoa Vang (ft. Quyền Thiện Đắc).mp3" }
        ];

        let currentIndex = -1;
        const audio = document.getElementById('audioPlayer');
        const songListContainer = document.getElementById('songList');
        const playerTitle = document.getElementById('playerTitle');
        const btnTogglePlay = document.getElementById('btnTogglePlay');
        const playIconSvg = document.getElementById('playIconSvg');
        const progressFill = document.getElementById('progressFill');
        const progressWrapper = document.getElementById('progressWrapper');
        const currentTimeEl = document.getElementById('currentTime');
        const totalDurationEl = document.getElementById('totalDuration');

        // Render danh sách bài hát
        function renderSongs() {
            songListContainer.innerHTML = '';
            songs.forEach((song, index) => {
                const row = document.createElement('div');
                row.className = `song-row ${index === currentIndex ? 'active' : ''}`;
                row.innerHTML = `
                    <div class="song-index-container">
                        <span class="song-index">${song.id}</span>
                        <svg class="row-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="song-info">
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">Ngọt</div>
                    </div>
                    <div class="song-duration" id="duration-${index}">--:--</div>
                `;
                
                row.addEventListener('click', () => {
                    playSong(index);
                });

                songListContainer.appendChild(row);
            });
        }

        // Hàm phát nhạc theo chỉ số (index)
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentIndex = index;
            const song = songs[currentIndex];
            
            audio.src = song.src;
            playerTitle.textContent = song.title;
            audio.play();
            
            updatePlayIcon(true);
            renderSongs();
        }

        // Cập nhật SVG nút Play/Pause ở thanh Player
        function updatePlayIcon(isPlaying) {
            if (isPlaying) {
                playIconSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                playIconSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        // Bấm nút Play/Pause dưới Player bar
        btnTogglePlay.addEventListener('click', () => {
            if (currentIndex === -1) {
                playSong(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                updatePlayIcon(true);
            } else {
                audio.pause();
                updatePlayIcon(false);
            }
        });

        // Bấm nút Play màu xanh ở trên Album header
        document.getElementById('btnHeaderPlay').addEventListener('click', () => {
            playSong(0);
        });

        // Chuyển bài kế tiếp / bài trước đó
        document.getElementById('btnNext').addEventListener('click', () => {
            if (currentIndex < songs.length - 1) playSong(currentIndex + 1);
        });

        document.getElementById('btnPrev').addEventListener('click', () => {
            if (currentIndex > 0) playSong(currentIndex - 1);
        });

        // Cập nhật thanh tiến trình chạy nhạc
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalDurationEl.textContent = formatTime(audio.duration);
            }
        });

        // Tua nhạc khi bấm vào thanh tiến trình
        progressWrapper.addEventListener('click', (e) => {
            const rect = progressWrapper.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = pos * audio.duration;
            }
        });

        // Định dạng giây thành mm:ss
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Tự động chuyển bài khi hát xong
        audio.addEventListener('ended', () => {
            if (currentIndex < songs.length - 1) {
                playSong(currentIndex + 1);
            } else {
                updatePlayIcon(false);
            }
        });

        // Khởi chạy ban đầu
        renderSongs();
    </script>
</body>
</html>
